# nginx.conf —— 前端静态资源 + /api 反向代理（容器形态）。
#
# 安全要点：
#   - server_tokens off 隐藏版本号；
#   - 基础安全响应头（nosniff / DENY / no-referrer / CSP / frame-ancestors）；
#   - 上传体积与后端 report.max_size_bytes(50MB) 对齐，留出 multipart 余量（64MB）；
#   - 反向代理保留真实 IP 与协议头，WebSocket 升级透传（/api/v1/ws）。

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64m;
    client_body_timeout  60s;

    # 报告产物下载/上传走后端（鉴权在应用层，nginx 不做访问控制）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        access_log off;
    }

    # 静态资源长缓存（文件名带 hash），index.html 不缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# WebSocket 升级所需的 Connection 变量映射（http 级别指令需放在 conf.d 的 http 上下文中）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
